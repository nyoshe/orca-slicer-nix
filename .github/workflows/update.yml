name: Update OrcaSlicer

on:
  schedule:
    # Twice a day: 06:00 and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-orca-slicer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}

      - name: Check latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest --jq '.tag_name')
          latest_version=${latest_tag#v}
          current_version=$(jq -r '.version' pkgs/orca-slicer/version.json)

          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $latest_version (currently packaging: $current_version)"

          if [ "$latest_version" = "$current_version" ]; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_current=false" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$latest_version" >/dev/null 2>&1 \
             || gh release view "v$latest_version" >/dev/null 2>&1; then
            echo "A release for v$latest_version already exists in this repo; nothing to do."
            echo "already_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prefetch new source hash
        id: prefetch
        if: steps.upstream.outputs.already_current != 'true'
        run: |
          set -euo pipefail
          version=${{ steps.upstream.outputs.latest_version }}
          hash=$(nix flake prefetch "github:OrcaSlicer/OrcaSlicer/v$version" --json | jq -r '.hash')
          echo "Resolved source hash: $hash"
          jq -n --arg version "$version" --arg hash "$hash" \
            '{version: $version, hash: $hash}' > pkgs/orca-slicer/version.json
          cat pkgs/orca-slicer/version.json

      - name: Build orca-slicer against the new release
        id: build
        if: steps.upstream.outputs.already_current != 'true'
        run: nix build .#orca-slicer -L

      - name: Commit, tag and release
        if: success() && steps.upstream.outputs.already_current != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${{ steps.upstream.outputs.latest_version }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/orca-slicer/version.json
          git commit -m "orca-slicer: $version"
          git tag "v$version"
          git push origin HEAD:main
          git push origin "v$version"

          gh release create "v$version" \
            --title "orca-slicer $version" \
            --notes "Automated update: builds OrcaSlicer [$version](https://github.com/OrcaSlicer/OrcaSlicer/releases/tag/v$version) from source. No human reviewed this release; see the linked upstream changelog for what changed."

      - name: Revert the version bump on failure
        # Runs whenever an earlier step in this job failed (e.g. the hash prefetch or the
        # build) - steps are otherwise skipped after a failure unless they opt back in
        # like this. The already-current early exit isn't a failure, so it never reaches here.
        if: failure()
        run: |
          echo "Update failed; leaving version.json untouched." >&2
          git checkout -- pkgs/orca-slicer/version.json
